<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Routes — Railwise</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .search-card { max-width: 600px; margin: 0 auto 32px; }

    .search-inputs {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 12px;
    }

    .swap-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-2); font-size: 1rem;
      transition: background var(--transition), transform var(--transition);
      margin-bottom: 2px; flex-shrink: 0;
    }
    .swap-btn:hover { background: var(--surface-2); transform: rotate(180deg); }

    .results-header {
      max-width: 600px; margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .results-label {
      font-size: 0.8rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3);
    }
    .changeover-note {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.8rem; color: var(--warning); background: var(--warning-light);
      padding: 4px 10px; border-radius: 20px; font-weight: 500;
    }

    .route-wrap { max-width: 600px; margin: 0 auto; }

    .route-segment {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px;
      flex-wrap: wrap;
    }
    .route-segment:last-child { border-bottom: none; }

    .route-times { display: flex; flex-direction: column; gap: 12px; min-width: 52px; }
    .route-time { font-family: var(--font-mono); font-size: 0.88rem; font-weight: 500; color: var(--text); }

    .route-line { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .route-dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); flex-shrink: 0; }
    .route-dot.filled { background: var(--accent); }
    .route-vline { width: 2px; height: 28px; background: var(--border-strong); }

    .route-stations { display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .route-station-name { font-size: 0.875rem; font-weight: 500; color: var(--text); line-height: 1; }
    .route-station-sub { font-size: 0.75rem; color: var(--text-3); margin-top: 2px; }

    .route-right {
      display: flex; flex-direction: column; align-items: flex-end;
      gap: 8px; margin-left: auto;
    }
    .route-train-badge {
      font-size: 0.75rem; font-weight: 500; font-family: var(--font-mono);
      color: var(--accent); background: var(--accent-light);
      padding: 3px 8px; border-radius: 4px; white-space: nowrap;
    }

    .transfer-divider {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px;
      background: var(--warning-light);
      border-bottom: 1px solid rgba(180,83,9,0.1);
      font-size: 0.78rem; font-weight: 600; color: var(--warning);
      text-transform: uppercase; letter-spacing: 0.06em;
    }

    .hero-prompt {
      max-width: 600px; margin: 0 auto;
      text-align: center; padding: 48px 0; color: var(--text-3);
    }
    .hero-prompt-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4; }
    .hero-prompt-text { font-size: 0.9rem; }

    @media (max-width: 500px) {
      .search-inputs { grid-template-columns: 1fr; }
      .swap-btn { display: none; }
    }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="page">
  <div class="page-header" style="text-align:center; max-width:600px; margin: 0 auto 28px;">
    <div class="page-title">Find your train</div>
    <div class="page-subtitle">Search direct and connecting routes between stations</div>
  </div>

  <div class="card search-card">
    <div class="card-body">
      <div id="search-alert" class="hidden"></div>
      <div class="search-inputs">
        <div class="form-group" style="margin:0">
          <label class="form-label" for="from">From</label>
          <input class="form-input" type="text" id="from" placeholder="Departure station" autocomplete="off">
        </div>
        <button class="swap-btn" id="swap-btn" title="Swap stations">⇄</button>
        <div class="form-group" style="margin:0">
          <label class="form-label" for="to">To</label>
          <input class="form-input" type="text" id="to" placeholder="Arrival station" autocomplete="off">
        </div>
      </div>
      <div class="mt-16">
        <button class="btn btn-primary btn-full" id="search-btn">Search routes</button>
      </div>
    </div>
  </div>

  <div id="results-area">
    <div class="hero-prompt">
      <div class="hero-prompt-icon">🚆</div>
      <div class="hero-prompt-text">Enter a departure and arrival station above to search for available routes</div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  renderNav('search');

  let lastSegments = [];

  document.getElementById('swap-btn').addEventListener('click', () => {
    const from = document.getElementById('from');
    const to   = document.getElementById('to');
    [from.value, to.value] = [to.value, from.value];
  });

  document.getElementById('search-btn').addEventListener('click', searchRoutes);
  document.getElementById('from').addEventListener('keydown', e => { if (e.key === 'Enter') searchRoutes(); });
  document.getElementById('to').addEventListener('keydown',   e => { if (e.key === 'Enter') searchRoutes(); });

  async function searchRoutes() {
    const from = document.getElementById('from').value.trim();
    const to   = document.getElementById('to').value.trim();
    clearAlert('search-alert');

    if (!from || !to) {
      showAlert('search-alert', 'Please enter both a departure and arrival station.', 'error');
      return;
    }
    if (from.toLowerCase() === to.toLowerCase()) {
      showAlert('search-alert', 'Departure and arrival stations must be different.', 'error');
      return;
    }

    const btn = document.getElementById('search-btn');
    setLoading(btn, true);
    document.getElementById('results-area').innerHTML = `<div style="text-align:center;padding:40px"><span class="spinner"></span></div>`;

    try {
      const result = await apiPost('/routes/search', { fromStation: from, toStation: to });
      renderResults(result);
    } catch (err) {
      let msg = 'Something went wrong. Please try again.';
      try {
        const body = JSON.parse(err.message);
        msg = body.error || msg;
      } catch {
        if (err.message.includes('No route') || err.message.includes('no route')) {
          msg = `No route found between <strong>${escHtml(from)}</strong> and <strong>${escHtml(to)}</strong>.`;
        } else if (err.message.includes('not found') || err.message.includes('Station')) {
          msg = `One or both stations were not found. Check the spelling and try again.`;
        }
      }
      document.getElementById('results-area').innerHTML = `
          <div class="route-wrap">
            <div class="alert alert-error"><span>✕</span><span>${msg}</span></div>
          </div>`;
    } finally {
      setLoading(btn, false, 'Search routes');
    }
  }

  // Store the chosen segment in sessionStorage and navigate to book page
  function bookSegment(index) {
    const seg = lastSegments[index];
    if (!seg) return;
    sessionStorage.setItem('pendingRoute', JSON.stringify(seg));
    window.location.href = 'book.html';
  }

  function renderResults(data) {
    const segments = data.segments || [];
    if (!segments.length) {
      document.getElementById('results-area').innerHTML =
              `<div class="hero-prompt"><div class="hero-prompt-text">No results returned.</div></div>`;
      return;
    }

    lastSegments = segments;
    const isChangeover = segments.length > 1;

    const headerHtml = `
        <div class="results-header">
          <span class="results-label">${segments.length} segment${segments.length > 1 ? 's' : ''} found</span>
          ${isChangeover
            ? `<span class="changeover-note">⇄ Changeover required</span>`
            : `<span class="badge badge-green">✓ Direct</span>`}
        </div>`;

    const isLoggedIn = Auth.isLoggedIn();
    let segmentsHtml = '';

    segments.forEach((seg, i) => {
      if (i > 0) {
        segmentsHtml += `
            <div class="transfer-divider">⇄ Transfer at ${escHtml(seg.fromStation)}</div>`;
      }
      segmentsHtml += `
          <div class="route-segment">
            <div class="route-times">
              <div class="route-time">${formatTime(seg.departure)}</div>
              <div class="route-time">${formatTime(seg.arrival)}</div>
            </div>
            <div class="route-line">
              <div class="route-dot filled"></div>
              <div class="route-vline"></div>
              <div class="route-dot"></div>
            </div>
            <div class="route-stations">
              <div>
                <div class="route-station-name">${escHtml(seg.fromStation)}</div>
                <div class="route-station-sub">Departure</div>
              </div>
              <div>
                <div class="route-station-name">${escHtml(seg.toStation)}</div>
                <div class="route-station-sub">Arrival</div>
              </div>
            </div>
            <div class="route-right">
              <span class="route-train-badge">${escHtml(seg.trainName)}</span>
              ${isLoggedIn
              ? `<button class="btn btn-primary btn-sm" onclick="bookSegment(${i})">Book this train →</button>`
              : `<a href="login.html" class="btn btn-secondary btn-sm">Sign in to book</a>`}
            </div>
          </div>`;
    });

    document.getElementById('results-area').innerHTML = `
        ${headerHtml}
        <div class="route-wrap">
          <div class="route-result">${segmentsHtml}</div>
        </div>`;
  }
</script>
</body>
</html>
