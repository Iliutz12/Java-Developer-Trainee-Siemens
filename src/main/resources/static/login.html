<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Railwise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="page-sm">
    <div class="auth-logo">
      <div class="auth-logo-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17l4-8h10l4 8"/><rect x="2" y="17" width="20" height="4" rx="1"/>
          <line x1="7" y1="17" x2="7" y2="21"/><line x1="17" y1="17" x2="17" y2="21"/>
        </svg>
      </div>
      <div class="auth-title">Welcome back</div>
      <div class="auth-sub">Sign in to your Railwise account</div>
    </div>

    <div class="card">
      <div class="card-body">
        <div id="alert-box" class="hidden"></div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input class="form-input" type="text" id="username" placeholder="your_username" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <div class="mt-8">
            <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">Sign in</button>
          </div>
        </form>
      </div>
    </div>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Register</a>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    renderNav('');

    // Redirect if already logged in
    if (Auth.isLoggedIn()) window.location.href = 'index.html';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      clearAlert('alert-box');
      setLoading(btn, true);

      try {
        const user = await apiPost('/home-page/login', {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        });
        Auth.set(user);
        window.location.href = 'index.html';
      } catch (err) {
        showAlert('alert-box', 'Invalid username or password.', 'error');
        setLoading(btn, false, 'Sign in');
      }
    });
  </script>
</body>
</html>
