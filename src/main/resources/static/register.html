<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Railwise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="page-sm">
    <div class="auth-logo">
      <div class="auth-logo-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17l4-8h10l4 8"/><rect x="2" y="17" width="20" height="4" rx="1"/>
          <line x1="7" y1="17" x2="7" y2="21"/><line x1="17" y1="17" x2="17" y2="21"/>
        </svg>
      </div>
      <div class="auth-title">Create an account</div>
      <div class="auth-sub">Start booking train tickets today</div>
    </div>

    <div class="card">
      <div class="card-body">
        <div id="alert-box" class="hidden"></div>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input class="form-input" type="text" id="username" placeholder="your_username" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input class="form-input" type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" placeholder="Choose a password" autocomplete="new-password" required minlength="6">
            <div class="form-hint">At least 6 characters</div>
          </div>
          <div class="form-group">
            <label class="form-label" for="role">Account type</label>
            <select class="form-select" id="role">
              <option value="CUSTOMER">Customer</option>
              <option value="ADMINISTRATOR">Administrator</option>
            </select>
          </div>
          <div class="mt-8">
            <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">Create account</button>
          </div>
        </form>
      </div>
    </div>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    renderNav('');

    if (Auth.isLoggedIn()) window.location.href = 'index.html';

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      clearAlert('alert-box');

      const password = document.getElementById('password').value;
      if (password.length < 6) {
        showAlert('alert-box', 'Password must be at least 6 characters.', 'error');
        return;
      }

      setLoading(btn, true);
      try {
        await apiPost('/home-page', {
          username: document.getElementById('username').value.trim(),
          email:    document.getElementById('email').value.trim(),
          password: password,
          role:     document.getElementById('role').value,
        });
        showAlert('alert-box', 'Account created! Redirecting to sign in…', 'success');
        setTimeout(() => window.location.href = 'login.html', 1400);
      } catch (err) {
        showAlert('alert-box', err.message || 'Registration failed. Username or email may already exist.', 'error');
        setLoading(btn, false, 'Create account');
      }
    });
  </script>
</body>
</html>
